# =============================================================================
# docker-compose.yaml
#
# Runs the full RMF backend stack HEADLESS: rmf-sim (fleet adapter + Gazebo
# server + schedule visualizer), zenoh-router, api-server, and rmf-web.
#
# See notes in README.md
#
# Images maintained by Nexsoss (https://github.com/nexsoss).
# Underlying software © Open Robotics 
# =============================================================================

# build-only dependency
services:
  rmf-base:
    build:
      context: .
      dockerfile: docker/Dockerfile.rmf
      args:
        ROS_DISTRO: lyrical
    image: quay.io/nexsoss/open-rmf:lyrical

# rmf with simulation
  rmf-sim:
    build:
      context: .
      dockerfile: docker/Dockerfile.rmf-sim
      args:
        ROS_DISTRO: lyrical
        RMF_IMAGE: quay.io/nexsoss/open-rmf:lyrical
    image: quay.io/nexsoss/open-rmf:lyrical_sim
    container_name: rmf-sim
    environment:
      - RMW_IMPLEMENTATION=rmw_zenoh_cpp
    network_mode: host
    command: >
      bash -c "source /home/ws_rmf/install/setup.bash &&
      ros2 launch ${SITE_PACKAGE:-example_site} ${SITE_PACKAGE:-example_site}.launch.xml
      headless:=true server_uri:=ws://localhost:8000/_internal"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'ros2 launch' > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    depends_on:
      rmf-api-server:
        # Wait for the API server to actually be serving, not just started,
        # so its (CPU-heavy) startup isn't competing with Gazebo spin-up.
        condition: service_healthy
      zenoh-router:
        condition: service_healthy

# rmf sim + the RMF Site toolchain. Build-only, like rmf-base:
#   docker compose --profile build build rmf-sim-site
  rmf-sim-site:
    profiles: ["build"]
    build:
      context: .
      dockerfile: docker/Dockerfile.rmf-sim-site
      args:
        ROS_DISTRO: lyrical
        SIM_IMAGE: quay.io/nexsoss/open-rmf:lyrical_sim
    image: quay.io/nexsoss/open-rmf:lyrical_sim-site

  # rmw_zenoh's own router, from the same image and zenoh revision as the
  # RMF nodes, so client and router can never drift apart.
  zenoh-router:
    image: quay.io/nexsoss/open-rmf:lyrical
    container_name: zenoh-router
    network_mode: host
    command: ["ros2", "run", "rmw_zenoh_cpp", "rmw_zenohd"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bash", "-c", "</dev/tcp/localhost/7447"]
      interval: 10s
      timeout: 5s
      retries: 5

# rmf api server
  rmf-api-server:
    build:
      context: .
      dockerfile: docker/Dockerfile.rmf-api-server
      args:
        ROS_DISTRO: lyrical
        RMF_IMAGE: quay.io/nexsoss/open-rmf:lyrical
    image: quay.io/nexsoss/open-rmf:lyrical_api-server
    container_name: rmf-api-server
    environment:
      - RMW_IMPLEMENTATION=rmw_zenoh_cpp
    depends_on:
      zenoh-router:
        condition: service_healthy
    network_mode: host
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "8000"]
      interval: 10s
      timeout: 5s
      # rmf-api-server's startup (rclpy/zenoh session + DB schema + uvicorn
      # bind) competes for CPU with rmf-sim's Gazebo process on constrained
      # hosts; 50s (the old 5 retries) was not enough headroom. 120s.
      retries: 12
    restart: unless-stopped

# rmf web dashboard
  rmf-web-dashboard:
    build:
      context: ./docker
      dockerfile: Dockerfile.rmf-web-dashboard
    image: quay.io/nexsoss/open-rmf:lyrical_web-dashboard
    container_name: rmf-web-dashboard
    depends_on:
      rmf-api-server:
        condition: service_started
      zenoh-router:
        condition: service_healthy
    ports:
      - "3000:80"
    restart: unless-stopped
