name: trivy-scan

on:
  workflow_run:
    workflows: ["nightly"]
    types:
      - completed

permissions:
  contents: read
  packages: read

jobs:
  scan-images:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    timeout-minutes: 30
    # One job per image, so a finding in one image doesn't hide the others.
    strategy:
      fail-fast: false
      matrix:
        tag-suffix: ["", "_sim", "_sim-site", "_api-server", "_web-dashboard", "_site-editor"]
    env:
      REGISTRY: ghcr.io
      IMAGE_OWNER: nexsoss
      IMAGE_NAME: open-rmf
    steps:
      - name: Compute short SHA from triggering nightly run
        id: tags
        run: |
          SHORT_SHA=$(echo "${{ github.event.workflow_run.head_sha }}" | cut -c1-7)
          echo "short=$SHORT_SHA" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550  # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ env.IMAGE_NAME }}:nightly_${{ steps.tags.outputs.short }}${{ matrix.tag-suffix }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
          format: table
