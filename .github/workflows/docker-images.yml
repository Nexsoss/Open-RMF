name: nightly

on:
  schedule:
    - cron: '0 2 * * *'
  push:
    branches:
      - lyrical

permissions:
  contents: read
  packages: write
  actions: write

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: nexsoss
  IMAGE_NAME: open-rmf
  ROS_DISTRO: lyrical

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3.12.0

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: tags
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "short=$SHORT_SHA" >> "$GITHUB_OUTPUT"

      - name: Build and push rmf
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6.19.2
        with:
          context: .
          file: docker/Dockerfile.rmf
          build-args: ROS_DISTRO=${{ env.ROS_DISTRO }}
          push: true
          provenance: false
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/${{ env.IMAGE_NAME }}:nightly_${{ env.ROS_DISTRO }}
            ghcr.io/${{ env.IMAGE_OWNER }}/${{ env.IMAGE_NAME }}:nightly_${{ steps.tags.outputs.short }}
          cache-from: type=gha,scope=rmf
          cache-to: type=gha,mode=max,scope=rmf

      - name: Build and push rmf-sim
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6.19.2
        with:
          context: .
          file: docker/Dockerfile.rmf-sim
          build-args: |
            ROS_DISTRO=${{ env.ROS_DISTRO }}
            RMF_IMAGE=ghcr.io/${{ env.IMAGE_OWNER }}/${{ env.IMAGE_NAME }}:nightly_${{ steps.tags.outputs.short }}
          push: true
          provenance: false
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/${{ env.IMAGE_NAME }}:nightly_${{ env.ROS_DISTRO }}_sim
            ghcr.io/${{ env.IMAGE_OWNER }}/${{ env.IMAGE_NAME }}:nightly_${{ steps.tags.outputs.short }}_sim
          cache-from: type=gha,scope=rmf
          cache-to: type=gha,mode=max,scope=rmf

      - name: Build and push api-server
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6.19.2
        with:
          context: .
          file: docker/Dockerfile.rmf-api-server
          build-args: |
            ROS_DISTRO=${{ env.ROS_DISTRO }}
            RMF_IMAGE=ghcr.io/${{ env.IMAGE_OWNER }}/${{ env.IMAGE_NAME }}:nightly_${{ steps.tags.outputs.short }}
          push: true
          provenance: false
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/${{ env.IMAGE_NAME }}:nightly_${{ env.ROS_DISTRO }}_api-server
            ghcr.io/${{ env.IMAGE_OWNER }}/${{ env.IMAGE_NAME }}:nightly_${{ steps.tags.outputs.short }}_api-server
          cache-from: type=gha,scope=api-server
          cache-to: type=gha,mode=max,scope=api-server

      - name: Build and push rmf-web (dashboard)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6.19.2
        with:
          context: ./docker
          file: docker/Dockerfile.rmf-web-dashboard
          push: true
          provenance: false
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/${{ env.IMAGE_NAME }}:nightly_${{ env.ROS_DISTRO }}_web-dashboard
            ghcr.io/${{ env.IMAGE_OWNER }}/${{ env.IMAGE_NAME }}:nightly_${{ steps.tags.outputs.short }}_web-dashboard
          cache-from: type=gha,scope=rmf-web
          cache-to: type=gha,mode=max,scope=rmf-web

      - name: Build and push sim-site
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6.19.2
        with:
          context: .
          file: docker/Dockerfile.rmf-sim-site
          build-args: |
            ROS_DISTRO=${{ env.ROS_DISTRO }}
            SIM_IMAGE=ghcr.io/${{ env.IMAGE_OWNER }}/${{ env.IMAGE_NAME }}:nightly_${{ steps.tags.outputs.short }}_sim
          push: true
          provenance: false
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/${{ env.IMAGE_NAME }}:nightly_${{ env.ROS_DISTRO }}_sim-site
            ghcr.io/${{ env.IMAGE_OWNER }}/${{ env.IMAGE_NAME }}:nightly_${{ steps.tags.outputs.short }}_sim-site
          cache-from: type=gha,scope=sim-site
          cache-to: type=gha,mode=max,scope=sim-site

      - name: Build and push site-editor
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6.19.2
        with:
          # Repository root: the Dockerfile copies docker/patches/.
          context: .
          file: docker/Dockerfile.site-editor
          push: true
          provenance: false
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/${{ env.IMAGE_NAME }}:nightly_site-editor
            ghcr.io/${{ env.IMAGE_OWNER }}/${{ env.IMAGE_NAME }}:nightly_${{ steps.tags.outputs.short }}_site-editor
          cache-from: type=gha,scope=site-editor
          cache-to: type=gha,mode=max,scope=site-editor