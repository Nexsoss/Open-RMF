name: nightly

on:
  schedule:
    - cron: '0 2 * * *'
env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: nexsoss
  IMAGE_NAME: open-rmf
  ROS_DISTRO: lyrical

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: tags
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "short=$SHORT_SHA" >> "$GITHUB_OUTPUT"

      - name: Build and push rmf
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.rmf
          build-args: ROS_DISTRO=${{ env.ROS_DISTRO }}
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/${{ env.IMAGE_NAME }}:nightly_${{ env.ROS_DISTRO }}
            ghcr.io/${{ env.IMAGE_OWNER }}/${{ env.IMAGE_NAME }}:nightly_${{ steps.tags.outputs.short }}
          cache-from: type=gha,scope=rmf
          cache-to: type=gha,mode=max,scope=rmf

      - name: Build and push api-server
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.rmf-api-server
          build-args: |
            ROS_DISTRO=${{ env.ROS_DISTRO }}
            RMF_IMAGE=ghcr.io/${{ env.IMAGE_OWNER }}/${{ env.IMAGE_NAME }}:nightly_${{ env.ROS_DISTRO }}
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/${{ env.IMAGE_NAME }}:nightly_${{ env.ROS_DISTRO }}_api-server
            ghcr.io/${{ env.IMAGE_OWNER }}/${{ env.IMAGE_NAME }}:nightly_${{ steps.tags.outputs.short }}
          cache-from: type=gha,scope=api-server
          cache-to: type=gha,mode=max,scope=api-server

      - name: Build and push rmf-web (dashboard)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.rmf-web-dashboard
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/${{ env.IMAGE_NAME }}:nightly_${{ env.ROS_DISTRO }}_web-dashboard
            ghcr.io/${{ env.IMAGE_OWNER }}/${{ env.IMAGE_NAME }}:nightly_${{ steps.tags.outputs.short }}
          cache-from: type=gha,scope=rmf-web
          cache-to: type=gha,mode=max,scope=rmf-web

      - name: Build and push site-editor
        uses: docker/build-push-action@v6
        with:
          context: ./docker
          file: docker/Dockerfile.site-editor
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/${{ env.IMAGE_NAME }}:nightly_site-editor
            ghcr.io/${{ env.IMAGE_OWNER }}/${{ env.IMAGE_NAME }}:nightly_${{ steps.tags.outputs.short }}
          cache-from: type=gha,scope=site-editor
          cache-to: type=gha,mode=max,scope=site-editor
